<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Demonic VR Spiegeltest</title>
<!--
  Lokaler Vergleichstest für den Spiegel-Modus.
  Video: MirrorTestVideo.mp4 – selbst erzeugt (ffmpeg testsrc2 + Zähler),
  H.264, ungeschützt, ohne Ton. Wird über ein echtes <video>-Element inline
  in derselben WKWebView abgespielt wie YouTube.
  Alles mit „HTML“ beschriftete ist HTML-Oberfläche, nicht Videobild.
-->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #0d0516; color: #fff; font: 15px -apple-system, system-ui, sans-serif; }
  header { padding: 10px 12px; background: #2a0f45; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  header strong { margin-right: auto; }
  button { font: inherit; font-weight: 600; padding: 8px 12px; border-radius: 8px; border: 0; background: #7cff2a; color: #000; }
  #stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  /* HTML-Oberfläche ÜBER dem Videorechteck – wie die YouTube-Bedienelemente. */
  .overlay { position: absolute; pointer-events: none; }
  #frameHtml { inset: 6px; border: 4px dashed #00e5ff; border-radius: 6px; }
  #labelHtml { left: 14px; bottom: 44px; padding: 4px 8px; background: rgba(0, 229, 255, .85); color: #000;
               font: 700 14px ui-monospace, monospace; border-radius: 4px; }
  #barHtml { left: 14px; right: 14px; bottom: 18px; height: 12px; background: rgba(255, 255, 255, .3); border-radius: 6px; }
  #barFillHtml { height: 100%; width: 0; background: #ff2d55; border-radius: 6px; }
  #playHtml { pointer-events: auto; position: absolute; right: 14px; bottom: 40px; padding: 4px 10px; background: rgba(0, 229, 255, .9); }
  main { padding: 12px; line-height: 1.4; }
  code { color: #7cff2a; }
</style>
</head>
<body>
<header>
  <strong>HTML-SEITE · Spiegeltest</strong>
  <button id="toggle" type="button">Pause</button>
  <button id="restart" type="button">Neustart</button>
</header>
<div id="stage">
  <video id="video" src="MirrorTestVideo.mp4" playsinline webkit-playsinline autoplay loop muted preload="auto"></video>
  <div id="frameHtml" class="overlay"></div>
  <div id="labelHtml" class="overlay">HTML-OVERLAY · rAF #0</div>
  <div id="barHtml" class="overlay"><div id="barFillHtml"></div></div>
  <button id="playHtml" type="button">HTML ⏯</button>
</div>
<main>
  <p>Im Videobild (Video-Ebene): Farbmuster, magenta Balken und „VIDEO-EBENE FRAME n“.</p>
  <p>Türkis gestrichelter Rahmen, Beschriftung „HTML-OVERLAY“, roter Fortschrittsbalken
     und der Knopf „HTML ⏯“ sind HTML-Oberfläche über dem Video.</p>
  <p id="state">Status: wird geladen …</p>
</main>
<script>
  (function () {
    var video = document.getElementById('video');
    var label = document.getElementById('labelHtml');
    var fill = document.getElementById('barFillHtml');
    var state = document.getElementById('state');
    var toggle = document.getElementById('toggle');
    var ticks = 0;
    function togglePlay() { if (video.paused) { video.play(); } else { video.pause(); } }
    toggle.addEventListener('click', togglePlay);
    document.getElementById('playHtml').addEventListener('click', togglePlay);
    document.getElementById('restart').addEventListener('click', function () { video.currentTime = 0; video.play(); });
    function frame() {
      ticks++;
      label.textContent = 'HTML-OVERLAY · rAF #' + ticks;
      if (video.duration > 0) { fill.style.width = (100 * video.currentTime / video.duration) + '%'; }
      toggle.textContent = video.paused ? 'Play' : 'Pause';
      state.textContent = 'Status: ' + (video.paused ? 'pausiert' : 'läuft') +
        ' · t=' + video.currentTime.toFixed(2) + ' s · ' + video.videoWidth + '×' + video.videoHeight +
        ' · readyState ' + video.readyState;
      window.requestAnimationFrame(frame);
    }
    window.requestAnimationFrame(frame);
    var started = video.play();
    if (started && started.catch) { started.catch(function () { state.textContent = 'Status: Autoplay blockiert – „Play“ antippen.'; }); }
  })();
</script>
</body>
</html>
